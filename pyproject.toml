[project]
name = "auto-zenn-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pyyaml",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_zenn_pipeline"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
