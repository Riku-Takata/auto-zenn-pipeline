name: Generate draft

on:
  push:
    branches: [main]
    paths: ['raw_logs/**/chat_history.json']
  workflow_dispatch:
    inputs:
      session_path:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-draft
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SESSION_PATH: ${{ inputs.session_path }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            uv run python scripts/generate_article.py --session "$SESSION_PATH"
          else
            uv run python scripts/generate_article.py --before "$BEFORE_SHA" --after "$AFTER_SHA"
          fi
