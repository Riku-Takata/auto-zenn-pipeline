- id: T-011
  title: LLM 呼び出しの包み(llm.py)と、本物の API を禁止する conftest
  milestone: M3
  request: "詳細設計「構成」の LLM の呼び出しと F-7 に従う。`src/auto_zenn_pipeline/llm.py` を作る。\n\n\
    `class LlmClient(Protocol)`:\n- メソッドは `call_tool(self, *, session: str, step:\
    \ str, model: str, system: str, user: str, tool_name: str, input_schema: dict[str,\
    \ Any], max_tokens: int) -> dict[str, Any]`。\n- 詳細設計のシグネチャに `session` と `step`\
    \ を足した。理由は、`LlmOutputError(session, step)` をここで作るため。\n\n`class AnthropicLlmClient`:\n\
    - コンストラクタは `__init__(self, client: anthropic.Anthropic | None = None)`。None なら\
    \ `anthropic.Anthropic()` を作る(キーは環境変数 `ANTHROPIC_API_KEY` から取る)。\n- `call_tool`\
    \ は `client.messages.create(model=model, max_tokens=max_tokens, system=system,\
    \ messages=[{\"role\": \"user\", \"content\": user}], tools=[{\"name\": tool_name,\
    \ \"description\": <任意の説明>, \"input_schema\": input_schema}], tool_choice={\"\
    type\": \"tool\", \"name\": tool_name})` を 1 回呼ぶ。\n- 応答の扱い:\n  - `stop_reason\
    \ == \"max_tokens\"` なら `LlmOutputError(session, step)` にする。\n  - content のうち、`type\
    \ == \"tool_use\"` で `name == tool_name` の最初のブロックの `input` を dict で返す。\n  - そのブロックが無いとき、または\
    \ input が dict でないときは `LlmOutputError(session, step)` にする。\n- リトライは SDK の既定に任せ、自前では書かない。\n\
    \n`tests/conftest.py` を作る。autouse の fixture で `anthropic.Anthropic.__init__` を\
    \ monkeypatch し、呼ばれたら RuntimeError を投げるようにする。これで、テストの中では本物のクライアントを作れなくなる。\n\n\
    テストでは、`messages.create` を持つ偽のクライアントのオブジェクトを `client=` で渡す(mypy のために `cast` を使ってよい)。"
  acceptance:
  - 偽のクライアントを渡して call_tool を呼ぶと、messages.create が 1 回呼ばれる。そのとき model、max_tokens、system、messages(user
    が 1 件)、tools(1 件で、name と input_schema が渡した値)、`tool_choice={'type':'tool','name':tool_name}`
    が渡る
  - 応答の tool_use ブロックの input が dict で返る(前に text ブロックがあっても同じ)
  - stop_reason が `max_tokens` だと `LlmOutputError` になり、session と step が渡した値になる
