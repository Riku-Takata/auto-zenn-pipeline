schema_version: '1.0'
product: auto-zenn-pipeline
milestones:
- id: M1
  title: 検証の土台
  goal: uv sync --frozen・ruff・mypy・pytest がローカルと CI(ci.yml)で回る。Stage 0 で外部仕様を確かめた結果が
    README に記録されている。
- id: M2
  title: 入力の検証(LLM なし)
  goal: pipeline.toml とセッションのログを読んで検証できる。シークレットの走査、LLM に渡す文字列の描画、サイズの検査、push で増えたセッションの検出もできる。LLM
    はまだ呼ばない。
- id: M3
  title: ADR と記事の生成(ローカル)
  goal: 偽の LLM で、ADR の抽出、記事の検証、slug の決定、Markdown の組み立てができる。CLI の --session ... --no-publish
    で、articles/<slug>.md と adr.json がローカルに書ける。
- id: M4
  title: 公開と自動化
  goal: CLI がブランチ・コミット・タグ・push・PR 作成までを行う。push と手動実行で 01_generate_draft.yml から動く。README
    の手順で運用できる。
- id: M5
  title: ナレッジから記事を書く(段階 1)
  goal: ハーネスが作った束(SourceBundle)の JSON から、azp run で、公開してよいかの検査・claude -p での執筆・組み立て・記事の PR までができる。セッションのログの入口と
    anthropic SDK はなくなっている。
- id: M6
  title: 記事の候補を挙げる(段階 2)
  goal: azp candidates が、束と書いた記事の一覧から、記事にできそうな候補を JSON と Markdown で出す。README で運用できる。
tasks:
- id: T-001
  title: プロジェクトの土台(pyproject・uv.lock・最小のパッケージ)
  milestone: M1
  request: "詳細設計 F-1「プロジェクトの土台」と「構成」の表に従って作る。\n- `pyproject.toml`\n  - プロジェクト名は `auto-zenn-pipeline`、パッケージは\
    \ `auto_zenn_pipeline`。src レイアウトで、ビルドバックエンドは hatchling。`requires-python = \">=3.12\"\
    `。\n  - 実行時の依存は `anthropic` と `pydantic`(v2)の 2 つだけにする。\n  - 開発用の依存(`[dependency-groups]`\
    \ の `dev`)は `ruff`、`mypy`、`pytest`、`pyyaml`、`types-pyyaml`。\n  - ruff の設定に `target-version\
    \ = \"py312\"` を書く。\n  - mypy の設定に `strict = true` と `plugins = [\"pydantic.mypy\"\
    ]` を書く。\n- `uv.lock` は `uv lock` で作る。版は解決された最新のままでよい(版の確認は T-003 で別に行う)。\n- `.python-version`\
    \ の内容は `3.12`。\n- `.gitignore` に `.venv/`、`__pycache__/`、`.mypy_cache/`、`.pytest_cache/`、`.ruff_cache/`\
    \ を書く。\n- `articles/.keep` と `raw_logs/.keep` を空のファイルで置く。\n- `src/auto_zenn_pipeline/__init__.py`\
    \ を置く。\n- 仮の `src/auto_zenn_pipeline/cli.py` を置く。中身は `def main(argv: list[str]\
    \ | None = None) -> int:` で 0 を返すだけ。T-018 で作り直す。\n- `scripts/generate_article.py`\
    \ は `from auto_zenn_pipeline.cli import main` をして `raise SystemExit(main())` するだけの薄い入口にする。\n\
    - `tests/test_package.py` に、`import auto_zenn_pipeline` が通ることを確かめるテストを 1 件書く。pytest\
    \ はテストが 0 件だと終了コード 5 になるため。cli.main の振る舞いを確かめるテストは書かない。\n- 既存の `README.md` には触らない。"
  acceptance:
  - '`uv sync --frozen` が成功する'
  - '`uv run ruff check` と `uv run ruff format --check` が違反 0 件で終わる'
  - '`uv run mypy src tests` が、strict の設定でエラー 0 件で終わる'
  - '`uv run pytest` が終了コード 0 で終わる'
  - '`.python-version` の内容が 3.12 で、`articles/.keep` と `raw_logs/.keep` がある'
  - '`pyproject.toml` の実行時の依存が `anthropic` と `pydantic` の 2 つだけである'
  depends_on: []
  size: S
  human_check: ''
  status: todo
- id: T-002
  title: CI ワークフロー(ci.yml)
  milestone: M1
  request: "詳細設計 F-12 の `ci.yml` を作る。\n- パスは `.github/workflows/ci.yml`。\n- `on` は\
    \ `pull_request` と `push`(`branches: [main]`)。\n- ジョブは 1 つで、`runs-on: ubuntu-latest`。手順は次の順にする。\n\
    \  1. `uses: actions/checkout@v4`\n  2. `uses: astral-sh/setup-uv@v6`\n  3. `run:\
    \ uv sync --frozen`\n  4. `run: uv run ruff check`\n  5. `run: uv run ruff format\
    \ --check`\n  6. `run: uv run mypy src tests`\n  7. `run: uv run pytest`\n  8.\
    \ `uses: docker://rhysd/actionlint:1.7.7`\n- `ANTHROPIC_API_KEY` は渡さない。この文字列をファイルに書かない。\n\
    - `tests/test_workflows.py` を作る。PyYAML で `ci.yml` を読み、上の構成を確かめる。PyYAML は `on`\
    \ キーを真偽値の `True` として読むので、`data.get(\"on\", data.get(True))` のように扱う。"
  acceptance:
  - '`.github/workflows/ci.yml` が PyYAML で読め、トリガーに `pull_request` と `push`(branches
    に main)がある'
  - run の手順に `uv sync --frozen`、`uv run ruff check`、`uv run ruff format --check`、`uv
    run mypy src tests`、`uv run pytest` が、この順で含まれる
  - uses に `rhysd/actionlint` を含む手順がある
  - ファイルの中に `ANTHROPIC_API_KEY` という文字列が無い
  - '`uv run pytest`(`tests/test_workflows.py` を含む)が通る'
  depends_on:
  - T-001
  size: S
  human_check: PR の上で CI ワークフローが起動し、actionlint を含むすべての手順が緑になることを確かめる。
  status: todo
- id: T-003
  title: 'Stage 0: 外部仕様の確認と README への記録(調べ物のみ)'
  milestone: M1
  request: "詳細設計「検証の方針」の Stage 0 の調べ物だけを行い、結果を `README.md` に記録する。コードと設定(pipeline.toml、pyproject.toml、uv.lock、ワークフロー)は変えない。結果をコードに反映するのは、承認のあとの別のタスクで行う。\n\
    - README の末尾に見出し `## 確認済みの外部仕様` を足し、その下に表を 1 つ置く。\n- 表の列は `項目 | 結果 | 出典 | 確認日\
    \ | 反映先` の 5 列。\n- 行は次の 8 つ。項目の列には、次の文言をそのまま書く。\n  1. モデル名の種別(claude-sonnet-5-5\
    \ / claude-opus-5-5 が固定スナップショットか別名か、スナップショット ID)\n  2. モデルのコンテキスト長・出力上限・料金\n \
    \ 3. tool_choice による tool 強制の書き方と、SDK の非ストリーミングでの max_tokens の上限\n  4. anthropic\
    \ Python SDK の現在の版\n  5. Zenn の slug・title の長さ・topics・emoji の制約\n  6. Zenn の GitHub\
    \ 連携(private リポジトリ、デプロイするブランチ)\n  7. GITHUB_TOKEN(contents: write)でのタグの push\n\
    \  8. 使う Action の現在の版(actions/checkout、astral-sh/setup-uv、rhysd/actionlint)\n\
    - 反映先は、行の順に次のとおり書く。\n  1. `pipeline.toml`\n  2. `pipeline.toml の limits`\n  3.\
    \ `llm.py`\n  4. `uv.lock`\n  5. `article.py`\n  6. `README`\n  7. `01_generate_draft.yml`\n\
    \  8. `ci.yml / 01_generate_draft.yml`\n- 出典には公式ドキュメントの URL を書く。確認日は `YYYY-MM-DD`\
    \ の形にする。\n- 確かめられなかった行は、結果を `未確認` にし、出典と確認日を `-` にする。\n- 既存の README の内容は消さない。"
  acceptance:
  - README.md に見出し `## 確認済みの外部仕様` がちょうど 1 つある
  - その見出しの下の表のヘッダが `項目 | 結果 | 出典 | 確認日 | 反映先` の 5 列である
  - 表のデータ行が 8 行ある
  - 各行の確認日は YYYY-MM-DD の形か `-` である。`-` の行は、結果が `未確認` である
  - 出典が `-` でない行は、`https://` で始まる URL を含む
  - README.md のほかに変わったファイルが無い
  depends_on: []
  size: S
  human_check: 各行の結果が出典の内容と合っているかを人間が確かめる。この結果をもとに、pipeline.toml・article.py の定数・Action
    の版を見直すタスクを別に起こすかどうかを決める。
  status: todo
- id: T-004
  title: 例外の階層(errors.py)と外部コマンドの実行口(runner.py)
  milestone: M2
  request: "詳細設計「モジュールの責務」の errors.py を作る。外部コマンドを呼ぶ口は `src/auto_zenn_pipeline/runner.py`\
    \ に置く。詳細設計では publish.py にあった CommandRunner をここに移す。理由は、session.py と publish.py\
    \ の両方が使うため。publish.py からは再エクスポートする(T-016 で行う)。\n\nerrors.py:\n- `class PipelineError(Exception)`\
    \ を基底にする。\n- 次の例外はすべて `PipelineError` の子にする。コンストラクタは示した順の引数を受け取り(キーワードでも位置でも渡せる)、同名の属性に保存する。\n\
    \  - `ConfigError(key: str)`\n  - `SessionError(session: str, file: str | None)`\n\
    \  - `SecretDetectedError(session: str, file: str, location: str, pattern_name:\
    \ str)`\n  - `LogTooLargeError(session: str, size: int, limit: int)`\n  - `LlmOutputError(session:\
    \ str, step: str)`\n  - `AlreadyGeneratedError(session: str, ref: str)`\n  - `PublishError(session:\
    \ str, command: str)`\n- `str(exc)` には、受け取った識別子を含める。文面は自由。\n\nrunner.py:\n- `@dataclass(frozen=True)\
    \ class CommandResult`。フィールドは `returncode: int`、`stdout: str`、`stderr: str`。\n\
    - `class CommandRunner(Protocol)`。メソッドは `def run(self, args: Sequence[str], *,\
    \ cwd: Path) -> CommandResult: ...`。\n- `class SubprocessRunner` は `CommandRunner`\
    \ を満たす。`subprocess.run(list(args), cwd=cwd, capture_output=True, text=True, encoding=\"\
    utf-8\", check=False)` を呼び、終了コードが 0 でなくても例外を投げずに `CommandResult` を返す。"
  acceptance:
  - 7 つの例外クラスがすべて `PipelineError` の子である
  - 各例外をキーワード引数で作ると、同名の属性に渡した値が入っている
  - 各例外の `str(exc)` に、渡した session(ConfigError では key)の文字列が含まれる
  - '`SubprocessRunner().run([''git'', ''--version''], cwd=tmp_path)` が、returncode
    0 と、`git version` を含む stdout を返す'
  - git のリポジトリでないディレクトリで `SubprocessRunner().run(['git', 'rev-parse', 'HEAD'], cwd=...)`
    を呼ぶと、例外を投げずに 0 以外の returncode を返す
  depends_on:
  - T-001
  size: S
  human_check: ''
  status: todo
- id: T-005
  title: 設定の読み込み(config.py、pipeline.toml)
  milestone: M2
  request: "詳細設計「pipeline.toml」の節と F-2 に従う。\n\nリポジトリ直下の `pipeline.toml` に、次の値を書く。\n\
    - `[models]`: `adr_extraction = \"claude-sonnet-5-5\"`、`article_writing = \"claude-sonnet-5-5\"\
    `、`evaluation = \"claude-opus-5-5\"`。evaluation には、Phase 2 用で今は使わないという注釈を付ける。\n\
    - `[limits]`: `max_log_chars = 300000`、`max_output_tokens_adr = 8000`、`max_output_tokens_article\
    \ = 16000`。\n\n`src/auto_zenn_pipeline/config.py` の中身:\n- frozen な dataclass(標準ライブラリ)を\
    \ 3 つ定義する。\n  - `ModelsConfig(adr_extraction: str, article_writing: str, evaluation:\
    \ str)`\n  - `LimitsConfig(max_log_chars: int, max_output_tokens_adr: int, max_output_tokens_article:\
    \ int)`\n  - `Config(models: ModelsConfig, limits: LimitsConfig)`\n- `load_config(path:\
    \ Path) -> Config` は `tomllib` で読む。\n\n`ConfigError(key)` にする条件と、そのときの key:\n\
    - ファイルが無い、または TOML として不正 → key は `str(path)`。\n- `[models]` か `[limits]` の表が無い\
    \ → key は `models` か `limits`。\n- キーが無い、または型が違う → key はドット区切りの名前(例: `limits.max_output_tokens_adr`)。int\
    \ の項目で bool(`true`)が来たときも型違いとして拒む。\n- モデル名が空文字列、空白だけ、または小文字にすると `latest` を含む →\
    \ key はモデル名のキー。\n- 数値が 0 以下 → key はその項目のキー。\n\n余分なキーは無視する。"
  acceptance:
  - リポジトリの `pipeline.toml` を `load_config` で読むと、`models.adr_extraction` と `models.article_writing`
    が `claude-sonnet-5-5`、`models.evaluation` が `claude-opus-5-5`、limits が 300000
    / 8000 / 16000 になる
  - 'キーが欠けると `ConfigError` になり、key 属性がドット区切りの名前(例: `limits.max_output_tokens_adr`)になる'
  - 型の違う値(数値の代わりに文字列、整数の代わりに `true`)で `ConfigError` になり、key がその項目の名前になる
  - 'モデル名が空文字列のとき、または `latest` を含むとき(例: `claude-sonnet-latest`)に `ConfigError` になり、key
    がその項目の名前になる'
  - 数値が 0 か負だと `ConfigError` になり、key がその項目の名前になる
  - 存在しないパス、または TOML として不正なファイルを渡すと `ConfigError` になり、key が渡したパスの文字列になる
  depends_on:
  - T-004
  size: S
  human_check: ''
  status: todo
- id: T-006
  title: pydantic モデルと JSON Schema の書き出し(models.py、schemas/)
  milestone: M2
  request: "詳細設計「データとコンテンツ」の chat_history.json、git_context.json、adr.json、ArticleDraft\
    \ の節と F-3 に従う。\n\n`src/auto_zenn_pipeline/models.py` に、次のモデルを定義する。余分なキーは、pydantic\
    \ の既定の `extra=\"ignore\"` で無視する。\n- `ChatMessage`: `role: Literal[\"user\", \"\
    assistant\"]`、`content: str`、`timestamp: AwareDatetime`\n- `ChatHistory`: `RootModel[list[ChatMessage]]`。要素は\
    \ 1 つ以上(`min_length=1`)。\n- `Commit`: `sha: str`(パターンは `^[0-9a-f]{7,40}$`)、`message:\
    \ str`、`timestamp: AwareDatetime`、`diff: str | None = None`\n- `GitContext`: `commits:\
    \ list[Commit] = []`\n- `AdrOption`: `name: str`、`summary: str`、`proposed_by:\
    \ Literal[\"human\", \"ai\"]`、`rejected_reason: str | None`\n- `AdrDecision`:\
    \ `choice: str`、`why: str`、`tradeoffs: list[str]`\n- `AiSteering`: `ai_initial:\
    \ str`、`problem: str`、`human_correction: str`\n- `AdrExtraction`: `worth_writing:\
    \ bool`、`skip_reason: str | None`、`context: str`、`options: list[AdrOption]`、`decision:\
    \ AdrDecision`、`ai_steering: list[AiSteering]`。worth_writing の不変条件は、このモデルには入れない(T-012\
    \ で確かめる)。\n- `Adr`: `schema_version: Literal[1]`、`session: str`、`source_commit:\
    \ str`、`model: str`、`generated_at: AwareDatetime`、`context`、`options`、`decision`、`ai_steering`(型は\
    \ AdrExtraction と同じ)。フィールドはこの順に並べる。\n- `ArticleDraft`: `title: str`、`emoji: str`、`topics:\
    \ list[str]`、`slug: str`、`body: str`。長さや形式の検証は T-014 で行う。\n\nJSON Schema の書き出し:\n\
    - `export_json_schemas() -> dict[str, str]` を models.py に置く。\n  - キーは `chat_history.schema.json`(ChatHistory)、`git_context.schema.json`(GitContext)、`adr.schema.json`(Adr)。\n\
    \  - 値は `json.dumps(Model.model_json_schema(), ensure_ascii=False, indent=2) +\
    \ \"\\n\"`。\n- `scripts/export_schemas.py` は、この結果を `Path(__file__).resolve().parent.parent\
    \ / \"schemas\"` の下に UTF-8 で書く。\n- 生成した `schemas/*.json` をコミットする。\n\n正常系の fixture\
    \ として、`tests/fixtures/raw_logs/2026-10-15_valid01/` に次の 2 つを置く。シークレットのパターンに当たる文字列は入れない。\n\
    - `chat_history.json`: user と assistant が交互に 4 件以上。複数行の content を 1 件、空文字列の content\
    \ を 1 件含める。時刻はタイムゾーン付き。\n- `git_context.json`: diff のあるコミットを 1 件、diff を省いたコミットを\
    \ 1 件。"
  acceptance:
  - fixture `2026-10-15_valid01` の `chat_history.json` と `git_context.json` が、`ChatHistory`
    と `GitContext` の `model_validate_json` で読める
  - '`ChatHistory` は、空の配列、role が `system` の要素、タイムゾーンの無い timestamp を `ValidationError`
    で拒む'
  - '`Commit` は、6 文字、大文字を含む、41 文字のいずれの sha も `ValidationError` で拒む。diff を省くと `None`
    になる'
  - モデルに無い余分なキーを含む入力も、エラーにならずに読める
  - '`export_json_schemas()` の各値が、コミット済みの `schemas/` の同名ファイルの内容と一致する'
  - '`uv run python scripts/export_schemas.py` を実行しても、git の作業ツリーに差分が出ない'
  depends_on:
  - T-001
  size: M
  human_check: ''
  status: todo
- id: T-007
  title: セッションの解決と読み込み(session.py の resolve_session と load_session)
  milestone: M2
  request: "詳細設計「セッションのディレクトリ」「共通の扱い」と F-4 の resolve_session の部分に従う。`src/auto_zenn_pipeline/session.py`\
    \ に作る。\n\n型:\n- `@dataclass(frozen=True) class SessionRef`。フィールドは `repo_root:\
    \ Path`(resolve 済み)、`name: str`(ディレクトリ名)、`path: Path`(resolve 済みの絶対パス)、`date:\
    \ datetime.date`、`session_id: str`(ディレクトリ名の最初の `_` より後ろ)。\n- `@dataclass(frozen=True)\
    \ class SessionLogs`。フィールドは `ref: SessionRef`、`chat: ChatHistory`、`git: GitContext`。\n\
    \n`resolve_session(repo_root: Path, path: str) -> SessionRef` は、次のどれかに当たると `SessionError(session=path(渡された文字列のまま),\
    \ file=None)` にする。\n- 絶対パスである。\n- パスの要素に `..` を含む。\n- `(repo_root / path).resolve()`\
    \ の親が `(repo_root / \"raw_logs\").resolve()` でない。シンボリックリンクで外へ出るものや、`raw_logs/a/b`\
    \ のようなものがこれに当たる。\n- ディレクトリ名が `^\\d{4}-\\d{2}-\\d{2}_[A-Za-z0-9_-]+$` に合わない。\n\
    - 日付の部分が `date.fromisoformat` で解釈できない。\n- ディレクトリが存在しない。\n\n`chat_history.json`\
    \ が無いときは `SessionError(session=path, file=\"chat_history.json\")` にする。末尾の `/`\
    \ は許す。\n\n`load_session(ref: SessionRef) -> SessionLogs`:\n- 各ファイルを `open(...,\
    \ encoding=\"utf-8\")` と `json.load` で読み、pydantic で検証する。\n- 次のときは `SessionError(session=ref.name,\
    \ file=\"chat_history.json\" または \"git_context.json\")` にする。\n  - BOM 付きなどで `json.JSONDecodeError`\
    \ になる。\n  - `UnicodeDecodeError` になる。\n  - `ValidationError` になる。\n- `git_context.json`\
    \ が無ければ `GitContext(commits=[])` とする。\n- 文字列は加工しない。"
  acceptance:
