- id: T-018
  title: 'CLI: 1 セッションの流れと --no-publish(cli.py)'
  milestone: M3
  request: '詳細設計 F-11 の 1 セッションの流れを、`--no-publish` で書くところまで作る。T-001 の仮の `src/auto_zenn_pipeline/cli.py`
    を作り直す。


    シグネチャは `main(argv: list[str] | None = None, *, llm: LlmClient | None = None, runner:
    CommandRunner | None = None, repo_root: Path | None = None) -> int`。

    - 既定値は、`llm` が `AnthropicLlmClient()`(LLM が必要になったときに初めて作る)、`runner` が `SubprocessRunner()`、`repo_root`
    が `Path.cwd()`。


    引数(argparse):

    - `--session PATH` と `--before SHA` は排他で、どちらか 1 つが必須。

    - `--after SHA` は `--before` と組で使う。

    - `--no-publish` はフラグ。

    - 引数の誤りは `parser.error` で `SystemExit(2)` にする。


    このタスクでの暫定の振る舞い:

    - `--no-publish` の無い `--session` と、`--before` は、`parser.error` で終了コード 2 にする。それぞれ
    T-019 と T-020 で外す。

    - この暫定の振る舞いを確かめるテストは書かない。


    1 セッションの流れ(`--no-publish` のとき):

    1. `load_config(repo_root / "pipeline.toml")` で設定を読む。

    2. `resolve_session(repo_root, path)` と `load_session` でセッションを解決して読む。

    3. `raw_logs/<name>/adr.json` があれば `AlreadyGeneratedError(session=name, ref=f"raw_logs/{name}/adr.json")`
    にする。

    4. `--no-publish` ではリモートを見ない。

    5. `scan` でシークレットを走査する。

    6. `render_logs` と `check_size(name, text, config.limits.max_log_chars)` で描画し、サイズを確かめる。

    7. `repo_root / "prompts" / "system_adr_extractor.md"` を読み、`extract_adr` を呼ぶ。`worth_writing`
    が false なら、stdout に `::notice title=skipped <name>::<skip_reason>` を出し、成功として終える。

    8. `runner.run(["git", "rev-parse", "HEAD"], cwd=repo_root)` で source_commit を得る(失敗したら
    `PublishError`)。`build_adr` に `model=config.models.adr_extraction` と `generated_at=datetime.now(UTC)`
    を渡す。`writing_guidelines.md` と `system_generator.md` を読み、`write_article` を呼ぶ。

    9. `choose_slug` の exists は `(repo_root / "articles" / f"{slug}.md").exists()`
    にする。

    10. `articles/<slug>.md`(`render_markdown`)と `raw_logs/<name>/adr.json`(`dump_adr`)を
    UTF-8 で書く。


    失敗の扱い:

    - セッションの処理中に例外(Exception)が出たら、stdout に `::error title=<type(exc).__name__> <セッション名>::<str(exc)>`
    を出し、終了コードを 1 にする。

    - セッション名は、解決できていれば name、できていなければ渡されたパスにする。

    - notice と error のメッセージは、`%` を `%25`、`\r` を `%0D`、`\n` を `%0A` の順で置き換える。'
  acceptance:
  - tmp_path に git リポジトリを作り、コミットを 1 つ置く。そこにリポジトリの pipeline.toml と prompts/ を写し、fixture
    `2026-10-15_valid01` を raw_logs/ に置く。偽の LLM で `main(['--session','raw_logs/2026-10-15_valid01','--no-publish'],
    llm=..., repo_root=...)` を呼ぶと 0 を返す。`articles/<slug>.md` の frontmatter が仕様どおりで、`raw_logs/2026-10-15_valid01/adr.json`
    を `Adr` として読むと、session と source_commit(HEAD)が正しい
  - worth_writing が false のとき、0 を返す。stdout に `::notice title=skipped 2026-10-15_valid01::`
    で始まる行があり、articles/ と adr.json が増えず、LLM の呼び出しは 1 回である
  - ログにシークレットがあるとき、1 を返す。stdout に `::error title=SecretDetectedError ` で始まる行があり、LLM
    の呼び出しは 0 回で、stdout と stderr に秘密の値が含まれない
  - content が 300001 文字のログのとき、1 を返す。stdout に `::error title=LogTooLargeError ` の行があり、LLM
    の呼び出しは 0 回である
  - adr.json が既にあるとき、1 を返す。stdout に `::error title=AlreadyGeneratedError ` の行があり、LLM
    の呼び出しは 0 回である
  - '`--session` と `--before` を両方渡したとき、またはどちらも渡さないときは、`SystemExit`(code 2)になる'
  depends_on:
  - T-005
  - T-009
  - T-010
  - T-015
  size: M
