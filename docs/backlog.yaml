    \ <一時ファイル>` を呼ぶ。stdout の前後の空白を除いたものを pr_url にする。一時ファイルは、呼んだあとで消す。\n10. `git switch\
    \ -` で元のブランチに戻る。\n\n手順 2 が成功したあとは、途中で失敗しても `finally` で `git switch -` を試みる。すでに例外が出ているときは、switch\
